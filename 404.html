<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Family history</title>
  <script>
    (function () {
      var base = '/family-history';
      var path = location.pathname;
      var rest = path.indexOf(base) === 0 ? path.slice(base.length) : path;
      rest = rest.replace(/^\/+|\/+$/g, '');
      if (rest === 'index.html') rest = '';
      var hash = rest ? '#/' + rest + location.search : '#/';
      location.replace(base + '/' + hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/family-history/#/">
</head>
<body>
  <p><a href="/family-history/#/">Family history</a></p>
</body>
</html>
